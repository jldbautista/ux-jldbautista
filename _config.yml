title: UX Portfolio - Joseph Lorenzo Bautista
author:
  name: jldbautista
  email: jdbautista1@csuchico.edu

description: >
  This is my CSCI431W UX website page. Here you'll see example blog entries that discuss issues of usability and user eXperience.

remote_theme: jekyll/minima

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag

sass:
  quiet_deps: true
  silence_deprecations: [import]

minima:
  skin: classic
  date_format: "%b %-d, %Y"
  show_excerpts: true

  nav_pages:
    - about.md

  social_links:
    - title: My Github
      icon: github
      url: "https://github.com/jldbautista/ux-jldbautista"

  hide_site_feed_link: true